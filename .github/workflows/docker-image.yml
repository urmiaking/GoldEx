name: docker-image

on:
  workflow_dispatch:

  push:
    branches:
      - 'master'

  release:
    types:
      - published

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  Version: 1.0.${{ github.run_number }}

jobs:
  create-image:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: |
            ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0

      - name: Build and push Docker image for goldex
        run: |
          docker build --push \
            -t reg.goldexsoft.ir/goldex:latest \
            -t reg.goldexsoft.ir/goldex:${Version} \
            -f src/App/Server/GoldEx.Server/Dockerfile \
            .

      - name: Build and push Docker image for goldex-karat
        run: |
          docker build --push \
            -t reg.goldexsoft.ir/goldex-karat:latest \
            -t reg.goldexsoft.ir/goldex-karat:${Version} \
            -f src/Calculator/Server/GoldEx.Calculator.Server/Dockerfile \
            .

      - name: Deploy
        run: |
          chmod +x /home/user/docker/goldex/refresh-apps.sh
          /home/user/docker/goldex/refresh-apps.sh "${Version}"