stages:
  - docker

variables:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_NOLOGO: "true"

docker-image:
  stage: docker
  resource_group: goldex-docker-production
  tags:
    - self-hosted   # match your runner tag
  rules:
    # push to master
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: on_success

    # release (tag)
    - if: '$CI_COMMIT_TAG'
      when: on_success

    # manual trigger (like workflow_dispatch)
    - when: manual

  script:
    - Version=$(python3 scripts/docker-version.py --image localhost:5000/goldex --image localhost:5000/goldex-karat)
    - export Version
    - echo "Building Docker image for GoldEx with version $Version"

    - |
      docker build --push \
        -t localhost:5000/goldex:$Version \
        --build-arg APP_VERSION="$Version" \
        --build-arg APP_REVISION="$CI_COMMIT_SHA" \
        -f src/App/Server/GoldEx.Server/Dockerfile \
        .

    - echo "Docker image for GoldEx with version $Version built and pushed successfully"

    - echo "Building Docker image for GoldEx Karat with version $Version"

    - |
      docker build --push \
        -t localhost:5000/goldex-karat:$Version \
        --build-arg APP_VERSION="$Version" \
        --build-arg APP_REVISION="$CI_COMMIT_SHA" \
        -f src/Calculator/Server/GoldEx.Calculator.Server/Dockerfile \
        .

    - echo "Docker image for GoldEx Karat with version $Version built and pushed successfully"

    - python3 scripts/docker-version.py --check "$Version" --image localhost:5000/goldex --image localhost:5000/goldex-karat
    - docker buildx imagetools create --tag localhost:5000/goldex:latest localhost:5000/goldex:$Version
    - docker buildx imagetools create --tag localhost:5000/goldex-karat:latest localhost:5000/goldex-karat:$Version

    - echo "Running initialization script"
    - sudo chmod +x /masoud/initialize.sh
    - sudo /masoud/initialize.sh
